<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d99f3"/>
      <stop offset="100%" stop-color="#0e569e"/>
    </linearGradient>
    <linearGradient id="droidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Phone frame outline inside -->
  <rect x="34" y="20" width="60" height="88" rx="10" fill="#1b2838" stroke="url(#phoneGrad)" stroke-width="3"/>

  <!-- Phone camera dot -->
  <circle cx="64" cy="27" r="2.5" fill="#7f8c8d"/>

  <!-- Phone Screen -->
  <rect x="38" y="34" width="52" height="66" rx="4" fill="#0f172a"/>

  <!-- Android Robot Head inside Screen -->
  <path d="M 49 66 A 15 15 0 0 1 79 66 Z" fill="url(#droidGrad)"/>
  
  <!-- Android Antennas -->
  <line x1="53" y1="52" x2="49" y2="47" stroke="#2ecc71" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="75" y1="52" x2="79" y2="47" stroke="#2ecc71" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Android Eyes -->
  <circle cx="56" cy="60" r="1.8" fill="#ffffff"/>
  <circle cx="72" cy="60" r="1.8" fill="#ffffff"/>

  <!-- Android Body -->
  <path d="M 49 69 L 79 69 C 79 77, 79 81, 79 83 A 4 4 0 0 1 75 87 L 53 87 A 4 4 0 0 1 49 83 Z" fill="url(#droidGrad)"/>

  <!-- Wayland W watermark subtle at corner -->
  <path d="M 82 82 L 86 98 L 91 88 L 96 98 L 100 82" fill="none" stroke="#3daee9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
